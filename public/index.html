    <div id="emergency-contacts" class="emergency-contacts" data-contacts-container></div>
    <!-- Leaflet JS (CDN) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Firebase configuration - SET TO null OR LEAVE EMPTY to use LOCAL-ONLY mode
        // The app works fine WITHOUT Firebase - contacts stored in localStorage
        var firebaseConfig = null;  // Set to null for local-only mode
        // OR set your Firebase config if you want cloud sync:
        // var firebaseConfig = { apiKey: "...", authDomain: "...", ... };

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Live Map
            if (window.SafeRoute && window.SafeRoute.LiveMap) {
                window.SafeRoute.LiveMap.init();
                console.log('[SafeRoute] Live Map initialized');
            }

            // Initialize App (which handles Firebase, Auth UI, and SOS)
            if (window.SafeRoute && window.SafeRoute.App) {
                window.SafeRoute.App.init({
                    firebaseConfig: firebaseConfig,
                    showAuthButton: true
                });
                console.log('[SafeRoute] App initialized');
            }
        });
    </script>
